[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "darwin-neg-router"
version = "0.4.1"
description = "Native Darwin NEG inference and selective 20-call refinement for CodePilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
benchmark = [
  "pandas>=2.2",
  "pyarrow>=18",
]
desktop = ["pyinstaller>=6.22,<7"]
neg = [
  "accelerate>=1.3",
  "bitsandbytes>=0.45",
  "huggingface-hub>=0.28",
  "safetensors>=0.5",
  "torch>=2.7",
  "transformers>=5.0",
]
test = ["pytest>=8.3"]

[project.scripts]
darwin-neg-router = "darwin_neg_router.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["darwin_neg_router*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
